[package]
name = "orch-acp"
version = "0.1.0"
edition = "2021"
description = "Finite ACP v1 stdio bridge supervised by OpenOrch"

[dependencies]
orch-core = { path = "../orch-core", features = ["protocol-io"] }
agent-client-protocol = "=2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "io-std", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["compat"] }

[dev-dependencies]
tempfile = "3"
